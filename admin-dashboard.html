<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MitraDrive</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="description" content="Panel Admin MitraDrive untuk mengelola seluruh pengajuan peminjaman kendaraan operasional.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="/logo.png" alt="MitraDrive Logo" class="logo-img">
                <span>Mitra<span class="text-primary">Drive</span>.</span>
            </div>
            <span class="badge-admin">Admin</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="overview" id="navOverview">
                <i class='bx bx-grid-alt'></i>
                <span>Overview</span>
            </a>
            <a href="#" class="nav-item" data-page="bookings" id="navBookings">
                <i class='bx bx-clipboard'></i>
                <span>Semua Pengajuan</span>
            <h2 id="actionTitle">Tindakan Admin</h2>
            <p id="actionSubtitle">Konfirmasi tindakan untuk pengajuan ini.</p>

            <div class="booking-preview" id="bookingPreview"></div>

            <form id="actionForm" class="mt-4 text-left">
                <input type="hidden" id="actionId">
                <input type="hidden" id="actionType">
                <div class="form-group text-left">
                    <label for="catatan"><i class='bx bx-comment-detail text-primary'></i> Catatan Admin (Opsional)</label>
                    <textarea id="catatan" placeholder="Tambahkan catatan atau alasan keputusan..." rows="3"></textarea>
                </div>
                <div class="modal-buttons mt-6">
                    <button type="button" class="btn-cancel" id="btnCancelAction">Batal</button>
                    <button type="submit" class="btn-confirm" id="btnConfirmAction">Konfirmasi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="adminToast">
        <div class="toast-content">
            <i class='bx bx-check-circle toast-icon'></i>
            <span id="toastMessage">Tindakan berhasil!</span>
        </div>
    </div>

    <!-- Official Paper Form Replica Modal -->
    <div class="modal-overlay" id="officialFormModal">
        <div class="modal-content" style="max-width: 860px; padding: 16px; background: transparent; box-shadow: none;">
            <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: white; padding: 12px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                <span style="font-weight: 700; color: #0f172a; font-size: 1rem;"><i class='bx bx-file text-primary'></i> Form Peminjaman Mobil Operasional Resmi</span>
                <div style="display: flex; gap: 10px;">
                    <button onclick="window.print()" class="btn-primary-solid" style="padding: 8px 16px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;">
                        <i class='bx bx-printer'></i> Cetak Form / Save PDF
                    </button>
                    <button id="closeOfficialFormBtn" style="padding: 8px 16px; background: #e2e8f0; color: #334155; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
                        Tutup
                    </button>
                </div>
            </div>

            <!-- Paper Replica -->
            <div class="official-form-container" id="officialFormContent">
                <!-- Injected dynamically by JS -->
            </div>
        </div>
    </div>

    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script type="module" src="js/admin.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('ServiceWorker registration successful');
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
